<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .switch-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

</head>
<body>

  <hr>
  <div class="switch-container">
    <input type="checkbox" id="toggleCarousel">
    <label for="toggleCarousel" style="cursor: pointer;">Activar Carrusel</label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
